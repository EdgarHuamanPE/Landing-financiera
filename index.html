<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>financiera</title>
    
  </head>
  <body class="font-sans text-gray-800">
   <!-- Preloader -->
  <div id="preloader" class="fixed inset-0 bg-white flex items-center justify-center z-10">
    <div class="flex flex-col items-center">
      <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-700 font-semibold">Cargando CrediRápido...</p>
    </div>
  </div> 

  <div id="content" class="hidden">
    <!-- Header -->
    <header class="bg-gray-800 text-white relative">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-2xl font-bold">CrediRápido</div>
            <nav class="hidden md:flex space-x-6">
                <a href="#" class="hover:text-yellow-400 transition">Inicio</a>
                <a href="#" class="hover:text-yellow-400 transition">Productos</a>
                <a href="#" class="hover:text-yellow-400 transition">Préstamos</a>
                <a href="#" class="hover:text-yellow-400 transition">Contacto</a>
            </nav>
            <div  class="md:hidden">
                <!-- Hamburger -->
                <button  id="menu-btn" class="focus:outline-none">
                    <svg  class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden  bg-gray-700 absolute w-full transform  -translate-y-56 opacity-0 transition-all duration-700">
            <a href="#" class="block px-6 py-2 hover:bg-gray-600">Inicio</a>
            <a href="#" class="block px-6 py-2 hover:bg-gray-600">Productos</a>
            <a href="#" class="block px-6 py-2 hover:bg-gray-600">Préstamos</a>
            <a href="#" class="block px-6 py-2 hover:bg-gray-600">Contacto</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-blue-600 text-white ">
        <div class="max-w-7xl mx-auto px-6 py-20 text-center md:text-left flex flex-col md:flex-row md:items-center md:justify-between gap-8">
        <div class="md:w-1/2">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Tu financiera confiable, rápido y seguro</h1>
            <p class="mb-6">Préstamos personales, cuentas de ahorro y servicios financieros diseñados para ti.</p>
            <a href="#" class="bg-yellow-400 text-gray-800 px-6 py-3 rounded-lg font-semibold hover:bg-yellow-500 transition">Abrir Cuenta</a>
        </div>
        <div class="md:w-1/2">
            <img src="/assets/images/main-md.jpg" alt="Hero" class="rounded-lg shadow-lg mx-auto block lg:hidden xl:hidden" >
            <img src="/assets/images//main-lg.jpg" alt="Hero" class="rounded-lg shadow-lg mx-auto hidden lg:block xl:hidden">
            <img src="/assets/images//main-xl.jpg" alt="Hero" class="rounded-lg shadow-lg mx-auto hidden xl:block ">
        </div>
        </div>
    </section>
</div>

  <!-- Script para toggle mobile menu -->
  <script type="module" src="/src/main.js"></script>

  </body>
</html>
